<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Hub — Social Media Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div class="sidebar-brand">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="12" stroke="#e91e8c" stroke-width="2"/><path d="M9 14l3 3 7-7" stroke="#e91e8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Content Hub</span>
      </div>
      <ul class="nav-items">
        <li><a href="#dashboard" class="nav-link active" data-view="dashboard">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
          <span>Dashboard</span>
        </a></li>
        <li><a href="#calendar" class="nav-link" data-view="calendar">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M2 8h16M6 1v4M14 1v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Calendar</span>
        </a></li>
        <li><a href="#create" class="nav-link" data-view="create">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Create</span>
        </a></li>
        <li><a href="#inspiration" class="nav-link" data-view="inspiration">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2a6 6 0 014 10.5V15a1 1 0 01-1 1H7a1 1 0 01-1-1v-2.5A6 6 0 0110 2z" stroke="currentColor" stroke-width="1.5"/><path d="M8 18h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Inspiration</span>
        </a></li>
        <li><a href="#references" class="nav-link" data-view="references">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 2h8l4 4v12a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5"/><path d="M12 2v4h4M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>References</span>
        </a></li>
        <li><a href="#scheduler" class="nav-link" data-view="scheduler">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Scheduler</span>
        </a></li>
        <li><a href="#analytics" class="nav-link" data-view="analytics">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 17V9M7 17V7M11 17v-6M15 17V5M19 17V3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Analytics</span>
        </a></li>
      </ul>
      <div class="sidebar-footer">
        <a href="#settings" class="nav-link" data-view="settings">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 1.5v2M10 16.5v2M3.5 3.5l1.4 1.4M15.1 15.1l1.4 1.4M1.5 10h2M16.5 10h2M3.5 16.5l1.4-1.4M15.1 4.9l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Settings</span>
        </a>
      </div>
    </nav>
    <main id="content">
      <div id="view-container"></div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
